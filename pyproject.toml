[project]
name = "agent-retrieval-lab"
version = "0.1.0"
description = "Versioned tutorials for evidence-based agent retrieval"
requires-python = ">=3.12"
dependencies = [
    "fastembed>=0.7,<0.8",
    "httpx[socks]>=0.28,<0.29",
    "jedi>=0.19,<0.20",
    "pypdf>=6,<7",
    "rank-bm25>=0.2.2,<0.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8,<10",
]
